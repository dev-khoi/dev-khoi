# Copy to .github/workflows/gitmas.yml in your profile repository.
# Replace YOUR_USERNAME/merry-gitmas@main with your published repository/ref.
name: Decorate my Christmas tree
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: write

concurrency:
  group: merry-gitmas
  cancel-in-progress: false

jobs:
  decorate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: YOUR_USERNAME/merry-gitmas@main
        with:
          login: ${{ github.repository_owner }}
          output-dir: gitmas
      - name: Publish generated artwork
        shell: bash
        run: |
          git add -- gitmas/tree.gif gitmas/tree.png gitmas/preview.html gitmas/snapshot.json gitmas/tree-state.json gitmas/FONT-LICENSE.txt
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Decorate my Gitmas tree'
          git push
